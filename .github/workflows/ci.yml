name: CI

on:
  pull_request:
    branches: [ "test", "main" ]
  push:
    branches: [ "test" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build & test (Maven)
        run: mvn -B test

      - name: Build jar (Maven)
        run: mvn -B -DskipTests package

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t health-service:ci .
